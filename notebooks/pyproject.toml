[project]
name = "minimind-structure-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4,<6",
    "marimo>=0.19,<1",
    "matplotlib>=3.10,<4",
    "Pillow>=10,<14",
    "torch>=2.6,<3",
    "tokenizers>=0.22,<0.23",
    "transformers>=4.57.6,<5",
    "soundfile>=0.13,<1",
    "librosa>=0.11,<1",
    "onnxruntime>=1.23,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
