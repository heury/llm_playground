[project]
name = "physicalai-notebooks"
version = "0.1.0"
description = "로봇 없이 시작하는 Physical AI 실습 marimo 노트북"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marimo>=0.25.2,<0.26",
    "mujoco>=3.3",
    "numpy>=1.26",
    "opencv-python-headless==4.13.0.*",
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.8",
    "torch>=2.4",
    "torchvision>=0.19",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    # 6~8장 LeRobot 데이터셋·ACT·SmolVLA
    "lerobot[dataset,training,smolvla]>=0.6",
]

[project.optional-dependencies]
# 9장 LLM Planner (외부 API)
llm = ["openai>=2.0"]

[tool.uv]
package = false
