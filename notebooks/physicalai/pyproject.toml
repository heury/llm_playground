[project]
name = "physicalai-notebooks"
version = "0.1.0"
description = "로봇 없이 시작하는 Physical AI 실습 marimo 노트북"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marimo>=0.25.2,<0.26",
    "mujoco>=3.3",
    "numpy>=1.26",
    # ultralytics 는 opencv-python 을, lerobot 은 opencv-python-headless 를 요구합니다.
    # 둘 다 cv2 모듈을 제공하므로 같은 버전으로 묶어 어느 쪽이 import 되어도 결과가 같게 합니다.
    "opencv-python==4.13.0.*",
    "opencv-python-headless==4.13.0.*",
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.8",
    "torch>=2.4",
    "torchvision>=0.19",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
]

[project.optional-dependencies]
# 4장 YOLO 절
vision = ["ultralytics>=8.3"]
# 6~8장 LeRobot 데이터셋·ACT·SmolVLA
lerobot = ["lerobot[dataset,training,smolvla]>=0.6"]
# 9장 LLM Planner (외부 API)
llm = ["openai>=2.0"]

[tool.uv]
package = false
